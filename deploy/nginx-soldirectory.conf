# SolDirectory — real production nginx config for the VPS layout this
# whole project has been deployed to (46.250.242.208):
#   apps/web  -> static build, served directly by nginx
#   apps/api  -> Node/Express, proxied at /api and /sitemap.xml
#   apps/cms  -> WordPress, no longer needs direct nginx exposure at
#               all — every WordPress call now goes through the Node
#               API's proxy (routes/wp.routes.ts), which is what
#               actually resolved the CORS issue this project spent
#               a long time chasing. WordPress itself can stay on its
#               internal port (8080, or wherever apps/cms actually
#               runs) without nginx routing anything to it directly.

server {
    listen 80;
    server_name directory.solbusinessconsultant.com.au 46.250.242.208;

    root /var/www/soldirectory/apps/web/dist;  # adjust to your real build output path
    index index.html;

    # --- Node API ---
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap is served by the Node API at root, not under /api —
    # crawlers expect /sitemap.xml at the site root by convention.
    # /sitemap.xml is an index; the parts it lists (sitemap-pages.xml,
    # sitemap-register-1.xml, …) come from the same place.
    location ~ ^/sitemap(-[a-z0-9-]+)?\.xml$ {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The "Find a provider" search page moved from /directory to
    # /find-a-provider (/directory/:slug profiles and /directory/in/:suburb
    # are unaffected — only the bare search/list page moved). A real 301
    # here — not just the client-side <Navigate> in AppRoutes.tsx — matters
    # because /directory was the nav's main link and may already be
    # indexed/bookmarked; a server redirect carries that link equity over
    # instead of leaving a client-only 200 that a crawler has to execute
    # JS to resolve.
    location = /directory {
        return 301 /find-a-provider$is_args$args;
    }

    # Account, token and authenticated application routes are functional UI,
    # not search landing pages. The legal documents remain noindex while the
    # application marks them as drafts pending legal review.
    location ~ ^/(login|signup|forgot-password|reset-password|confirm-capacity|privacy|terms|provider-agreement|lead-disclaimer|dashboard|workers(?:/|$)|worker/profile(?:/|$)|provider/listing(?:/|$)|providers/|leads(?:/|$)|plans(?:/|$)|onboarding(?:/|$)|verification(?:/|$)|admin(?:/|$)|find-providers(?:/|$)|saved-providers(?:/|$)) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/index.html @private_spa;
    }

    location @private_spa {
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /index.html break;
    }

    location = / {
        rewrite ^ /seo-shell/ break;
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    # Keep the sitemap and canonical form of the services hub at /services.
    # An exact proxy prevents nginx from treating dist/services/ as a static
    # directory and issuing an automatic trailing-slash redirect.
    location = /services {
        rewrite ^ /seo-shell/services break;
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location = /services/ {
        return 301 /services$is_args$args;
    }

    # --- Public-register pages (/ndis-providers/…, /aged-care-providers/…),
    #     provider profiles (/directory/<slug>), location and experience pages
    #     (/directory/in/<suburb>, /directory/for/<condition>), WordPress service pages
    #     (/services/<slug>) and independent-worker pages
    #     (/independent-workers/find and /independent-workers/<slug>) ---
    # The site is a client-rendered SPA, so these pages (26,000+ register
    # listings alone) would be an
    # empty <div> to any crawler that doesn't run JavaScript. The API
    # returns the same built index.html with this page's title, meta,
    # canonical, JSON-LD and a plain-HTML copy of its content filled in
    # (apps/api/src/controllers/registerShell.controller.ts). If the API is
    # down we fall back to the plain SPA shell, so the pages still work.
    # Needs WEB_DIST_DIR in the API's env if the API isn't started from
    # apps/api (default: ../web/dist relative to its working directory).
    # condition(/[^/]+)?/?$, funding(/[^/]+)?/?$, guides(/[^/]+)?/?$ and language(/[^/]+)?/?$ cover each hub and
    # its authored detail pages. These are substantive educational pages
    # even when no current member profile matches the topic.
    # The condition routes use the
    # permalink-style /condition/:slug/ detail pages — its own
    # top-level category prefix, not nested under /directory.
    # services/[^/]+/[^/]+/[^/]+/?$ is the real service x state x suburb
    # page (/services/:service/:state/:suburb, ServiceLocationPage.tsx) —
    # only exists for a combination the register has genuine demand for
    # (see computeServiceSuburbs); everything else falls through to the
    # SPA, which 404s the same way any other unknown route does.
    location ~ ^/((ndis-providers|aged-care-providers)(/|$)|find-a-provider/?$|locations(/[^/]+)?/?$|providers/?$|support-coordinators/?$|blog(/[^/]+)?/?$|directory/[^/]+/?$|directory/in/[^/]+/?$|condition(/[^/]+)?/?$|funding(/[^/]+)?/?$|guides(/[^/]+)?/?$|language(/[^/]+)?/?$|services/?$|services/[^/]+/?$|services/[^/]+/[^/]+/?$|services/[^/]+/[^/]+/[^/]+/?$|independent-workers(/[^/]+)?/?$|[a-z0-9][a-z0-9-]*/?$) {
        # $uri contains only the path. nginx preserves the original query
        # string automatically; $request_uri would embed it in the rewrite.
        rewrite ^ /seo-shell$uri break;
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        # This fallback keeps the browser application available during an
        # API/content outage, but its generic shell must not replace a rich
        # canonical page in a search index.
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /index.html break;
    }

    # --- React SPA fallback (spec item 43) ---
    # This is the actual fix for a dynamic route like /services/test
    # returning a raw nginx 404 instead of reaching React Router.
    # try_files checks for a real file first (JS/CSS/image assets),
    # then falls back to index.html for anything else — letting
    # React Router's own client-side routing (and its WordPress
    # catch-all resolver) decide what to render, including a proper
    # in-app 404 for genuinely missing content, rather than nginx
    # deciding first and being wrong.
    #
    # Pages written at build time by apps/web/scripts/prerender.mjs (the hub
    # pages, guides and funding topics) live at <path>/index.html: naming that
    # file explicitly (instead of `$uri/`) serves /funding/x and /funding/x/
    # alike without nginx redirecting one to the other.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Reasonable caching for hashed build assets — safe because Vite
    # fingerprints filenames on every build, so a stale cache can't
    # serve outdated JS/CSS under the same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
